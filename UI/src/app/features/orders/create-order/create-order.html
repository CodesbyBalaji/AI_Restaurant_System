<div class="min-h-screen bg-gradient-to-br from-slate-100 via-blue-50 to-indigo-100 flex items-center justify-center p-6">

  <div class="w-full max-w-lg">

    <!-- Header -->
    <div class="text-center mb-8">
      <div
        class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center mx-auto shadow-lg mb-4">
        <span class="text-4xl">🛒</span>
      </div>

      <h1 class="text-3xl font-bold text-gray-800">
        Create New Order
      </h1>

      <p class="text-gray-500 mt-2">
        Select a menu item and quantity to place an order.
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-3xl shadow-2xl p-8 border border-gray-100">

      <!-- Menu -->
      <div class="mb-6">

        <label class="block text-gray-700 font-semibold mb-2">
          🍽 Menu Item
        </label>

        <select
          [(ngModel)]="selectedItemId"
          class="w-full rounded-xl border-2 border-gray-200 px-4 py-3
                 focus:border-blue-500 focus:ring-4 focus:ring-blue-100
                 outline-none transition">

          <option value="0">
            Select Menu Item
          </option>

          <option
            *ngFor="let item of menu"
            [value]="item.id">

            {{ item.name }} - ₹{{ item.price }}

          </option>

        </select>

      </div>

      <!-- Quantity -->
      <div class="mb-6">

        <label class="block text-gray-700 font-semibold mb-2">
          🔢 Quantity
        </label>

        <input
          type="number"
          min="1"
          [(ngModel)]="quantity"
          class="w-full rounded-xl border-2 border-gray-200 px-4 py-3
                 focus:border-blue-500 focus:ring-4 focus:ring-blue-100
                 outline-none transition"
          placeholder="Enter quantity">

      </div>

      <!-- Summary -->
      <div
        class="bg-blue-50 border border-blue-100 rounded-xl p-4 mb-6">

        <h3 class="font-semibold text-blue-700 mb-2">
          Order Summary
        </h3>

        <div class="flex justify-between text-gray-700">

          <span>Selected Item</span>

          <span class="font-medium">
            {{
              selectedItemId == 0
                ? 'Not Selected'
                : (menu.find(m => m.id == selectedItemId)?.name)
            }}
          </span>

        </div>

        <div class="flex justify-between mt-2 text-gray-700">

          <span>Quantity</span>

          <span class="font-medium">
            {{ quantity }}
          </span>

        </div>

      </div>

      <!-- Button -->
      <button
        (click)="placeOrder()"
        [disabled]="!isManager()"
        class="w-full py-3 rounded-xl text-lg font-semibold text-white
               bg-gradient-to-r from-blue-600 to-indigo-600
               hover:from-blue-700 hover:to-indigo-700
               transition duration-300 shadow-lg
               disabled:from-gray-400 disabled:to-gray-500
               disabled:cursor-not-allowed">

        🛒 Place Order

      </button>

      <!-- Manager Info -->
      <div
        *ngIf="!isManager()"
        class="mt-5 text-center text-red-500 font-medium">

        Only Managers are allowed to place orders.

      </div>

    </div>

  </div>

</div>
